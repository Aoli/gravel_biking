name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Web
        run: |
          flutter build web --release \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=MAPTILER_KEY=${{ secrets.MAPTILER_KEY }}

      - name: Install Functions deps
        run: |
          cd functions
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Prepare Firebase auth (Service Account)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $RUNNER_TEMP/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> $GITHUB_ENV

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Deploy Functions (nvdbProxy)
        run: firebase deploy --only functions:nvdbProxy --project gravel-biking --non-interactive

      - name: Deploy to Firebase Hosting - develop channel
        run: firebase hosting:channel:deploy develop --project gravel-biking --non-interactive

  # Hosting deployed via Firebase CLI above to the "develop" preview channel
